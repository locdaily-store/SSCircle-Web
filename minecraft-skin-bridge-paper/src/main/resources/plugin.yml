name: SSCircleSkinBridge
version: '10.49.1.3'
main: id.sscircle.skin.SSCircleSkinBridge
api-version: '26.3'
author: SSCircle
website: https://github.com/locdaily-store/SSCircle-Web
description: Sinkronisasi skin server ke Profile SSCircle tanpa mengganti autentikasi, inventory atau UUID
# Core must be initialized before its authenticated identity guard is consulted.
depend: [SSCirclePlayerSync]
softdepend: [SkinsRestorer]
commands:
  ssskin:
    description: Periksa dan sinkronkan skin SSCircle
    usage: /ssskin [status|sync|inspect|reload]
permissions:
  sscircle.admin:
    default: op
