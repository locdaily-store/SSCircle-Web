name: SSCirclePlayerSync
version: '10.48.0'
main: id.sscircle.paper.SSCirclePaperLinkPlugin
api-version: '26.3'
author: RinxAsoy
description: Menghubungkan akun Minecraft terverifikasi langsung dari Paper ke Profile SSCircle
website: https://github.com/locdaily-store/SSCircle-Web
softdepend: [floodgate, AuthMe, AuthMeReloaded, packetevents]
commands:
  sscircle:
    description: Hubungkan akun Minecraft dengan Profile SSCircle
    usage: /sscircle [help|status|link <kode>|diagnose|sync|reload]
permissions:
  sscircle.admin:
    description: Memuat ulang konfigurasi SSCircle Player Sync
    default: op
