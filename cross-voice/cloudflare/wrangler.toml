name = "sscircle-cross-voice"
main = "src/index.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Origin persis dari website SSCircle (tanpa slash terakhir). Preview: gunakan origin preview sendiri.
VOICE_ORIGIN = "https://sscircle.example.com"
VOICE_SERVER_KEY = "sscircle-main"
VOICE_MAX_CLIENTS = "50"

[[durable_objects.bindings]]
name = "VOICE_ROOM"
class_name = "VoiceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceRoom"]

# Tidak ada database audio atau rekaman. Secret ditambahkan dengan:
# npx wrangler secret put VOICE_BRIDGE_SECRET --config cross-voice/cloudflare/wrangler.toml
