name: SSCircle Cross Voice CI
on:
  pull_request:
    paths:
      - 'cross-voice/**'
      - 'voice.html'
      - 'voice.css'
      - 'voice.js'
      - 'voice-config.js'
      - 'voice-worklet.js'
      - 'scripts/package_cross_voice.py'
      - '.github/workflows/cross-voice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    name: Uji keamanan pairing dan audio gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pasang dependensi gateway Node.js
        run: npm install --no-audit --no-fund --prefix cross-voice/gateway
      - name: Periksa sintaks browser dan gateway
        run: |
          node --check voice.js
          node --check voice-worklet.js
          node --check cross-voice/gateway/server.mjs
      - name: Uji audio dua arah, pairing dan keamanan WebSocket
        run: npm test --prefix cross-voice/gateway
  paper:
    name: Build Paper 26.3 dengan API resmi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile dengan Paper API dan Simple Voice Chat API asli
        run: gradle -p cross-voice/paper clean build --no-daemon --stacktrace
      - name: Upload JAR hanya jika build asli berhasil
        uses: actions/upload-artifact@v4
        with:
          name: SSCircleCrossVoice-JAR
          path: cross-voice/paper/build/libs/SSCircleCrossVoice.jar
          if-no-files-found: error
  package:
    name: Paket distribusi FULL dan ONLY CHANGES
    runs-on: ubuntu-latest
    needs: [paper,gateway]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: SSCircleCrossVoice-JAR
          path: build/cross-voice
      - name: Pastikan JAR hasil kompilasi benar tersedia
        run: test -s build/cross-voice/SSCircleCrossVoice.jar
      - name: Buat ZIP lengkap dan hanya perubahan
        run: python3 scripts/package_cross_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: SSCircle-Cross-Voice-Distribution
          path: |
            dist/SSCircle-Cross-Voice-FULL.zip
            dist/SSCircle-Cross-Voice-ONLY-CHANGES.zip
          if-no-files-found: error
