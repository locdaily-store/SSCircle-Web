name: SSCircle Voice iOS Compile

on:
  pull_request:
    paths:
      - 'cross-voice/mobile/ios/**'
      - '.github/workflows/cross-voice-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Build iOS simulator (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd cross-voice/mobile/ios && xcodegen generate --spec project.yml
      - name: Compile simulator app (does not produce an installable iPhone IPA)
        run: |
          xcodebuild -project cross-voice/mobile/ios/SSCircleVoice.xcodeproj \
            -scheme SSCircleVoice -sdk iphonesimulator \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
