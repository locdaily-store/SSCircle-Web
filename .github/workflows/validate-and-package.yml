# Cek revisi tim dan buat ZIP Cloudflare. Tidak ada deploy otomatis dari workflow ini.
name: Periksa dan kemas SSCircle untuk Cloudflare

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ambil kode SSCircle
        uses: actions/checkout@v4

      - name: Pasang Node.js untuk pemeriksaan JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Periksa file wajib dan sintaks
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html admin.html registration.html status.html voting.html seasons.html seasons.js seasons-admin.js mailbox.html mailbox.js mailbox.css announcements.html announcements.js announcements.css announcements-admin.js announcements-admin.css overview-dashboard.js overview-dashboard.css _worker.js _routes.json; do
            test -f "$file" || { echo "File wajib hilang: $file"; exit 1; }
          done
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' ! -path './.git/*' ! -path './.github/*' ! -path './node_modules/*' -print0)
          python -c 'import json; json.load(open("_routes.json", encoding="utf-8"))'

      - name: Uji sesi Voting dan penyimpanan Admin Control
        run: node --test tests/worker.test.mjs

      - name: Uji Server Rules dan Event Calendar
        run: node --test tests/rules-regression.test.mjs

      - name: Uji Voting dengan beberapa pertanyaan
        run: node --test tests/voting-multi.test.mjs

      - name: Uji Season Archive dan kompatibilitas Leaderboard
        run: node --test tests/seasons.test.mjs

      - name: Uji Member Center, kebijakan profil, awards dan pencabutan sesi
        run: node --test tests/member-center.test.mjs

      - name: Uji izin pencarian anggota dan pertemanan
        run: node --test tests/member-social.test.mjs

      - name: Uji keamanan akun, derivasi password dan Mail Box
        run: node --test tests/security.test.mjs tests/mailbox.test.mjs tests/password-client.test.mjs

      - name: Verifikasi kesiapan binding runtime tanpa mengekspos secret
        run: node --test tests/runtime-health.test.mjs

      - name: Uji Database Inspector GitHub (offline, tanpa Cloudflare)
        run: python3 -m unittest discover -s tests -p test_d1_inspector.py

      - name: Uji pengamanan migrasi D1 Staging
        run: python3 -m unittest discover -s tests -p test_staging_migration_guard.py

      - name: Uji live inspector GitHub Pages dan CORS tanpa Cloudflare
        run: node --test tests/github-db-inspector.test.mjs

      - name: Uji penghubung akun Minecraft dan verifikasi server
        run: node --test tests/minecraft-link.test.mjs

      - name: Uji kontrak plugin Paper Direct tanpa Velocity
        run: node --test tests/paper-link.test.mjs

      - name: Uji konfigurasi Profile dan modal
        run: node --test tests/profile-ui.test.mjs

      - name: Pasang browser untuk tes responsif
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install chromium

      - name: Uji direktori dan popup Member Social pada desktop dan HP
        run: python tests/browser_member_social.py

      - name: Uji navigasi Profile desktop tablet dan HP
        run: python tests/browser_profile_workspace.py

      - name: Uji warna CSP dan tampilan HP
        run: python tests/browser_smoke.py

      - name: Uji responsif Upcoming Events, Season Archive, dan Admin Control
        run: python tests/layout_regression.py

      - name: Uji Mail Box responsif dan alur Cek Status tanpa redirect Voting
        run: python tests/browser_mailbox.py

      - name: Uji dropdown native agar tidak putih-putih di desktop dan HP
        run: python tests/browser_dropdown_theme.py

      - name: Uji tema dropdown, seluruh kontrak Worker, dan lingkungan localhost
        shell: bash
        run: |
          # Run test files sequentially to avoid overloading isolated SQLite and PBKDF2 fixtures.
          if node --test --test-concurrency=1 tests/*.test.mjs > /tmp/sscircle-tests.log 2>&1; then
            tail -n 14 /tmp/sscircle-tests.log
          else
            echo "Gagal menjalankan semua tes. Ringkasan kegagalan:"
            grep -E 'not ok|# (test|failureType|error|expected|actual|fail|pass)|ERR_|AssertionError' /tmp/sscircle-tests.log | cut -c 1-350 | tail -n 65 || true
            exit 1
          fi

      - name: Periksa file sensitif (pemeriksaan dasar)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import re, subprocess, sys

          tracked = [PurePosixPath(p.decode('utf-8')) for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          secret_suffixes = {'.db','.sqlite','.sqlite3','.dump','.pem','.key','.p12','.pfx','.bak','.backup','.zip','.7z','.rar','.log'}
          secret_names = {'credentials.json','secrets.json','id_rsa','id_ed25519'}
          for relative in tracked:
              name = relative.name.lower()
              if relative.suffix.lower() == '.sql' and str(relative) not in {'dev/local-schema.sql','dev/local-seed.sql'} and (len(relative.parts) != 2 or relative.parts[0] != 'migrations'):
                  sys.exit(f'SQL di luar folder migrations tidak diizinkan: {relative}')
              if name.startswith('.env') or (name.startswith('.dev.vars') and name != '.dev.vars.example') or name in secret_names or name.startswith('service-account') or relative.suffix.lower() in secret_suffixes:
                  sys.exit(f'File berisiko ikut di-commit: {relative}; hapus dari Git dan rotasi credential jika perlu')

          patterns = [
              ('private key',re.compile(r'-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----')),
              ('GitHub token',re.compile(r'\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b')),
              ('AWS access key',re.compile(r'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b')),
              ('API key inline',re.compile(r"""(?i)\b(?:api[_-]?token|api[_-]?key|client[_-]?secret|admin[_-]?password|session[_-]?secret)\b\s*[:=]\s*['\"][^'\"]{8,}['\"]""")),
          ]
          # Dev sample values must be placeholders, not usable production credentials.
          if PurePosixPath('.dev.vars.example') in tracked:
              example=Path('.dev.vars.example').read_text('utf-8')
              if not all(token in example for token in ('SESSION_SECRET=','ADMIN_PASSWORD=','SSCIRCLE_LINK_SERVER_SECRET=')):
                  sys.exit('Contoh .dev.vars tidak lengkap.')
              if any(len(value.strip())>80 for value in example.splitlines() if '=' in value and not value.lstrip().startswith('#')):
                  sys.exit('Contoh .dev.vars terlalu panjang: tinjau kemungkinan rahasia.\n')
          checked = 0
          for relative in tracked:
              # Definisi regex di workflow memang berisi pola token. Jangan memicu false positive atas definisinya sendiri.
              if str(relative).startswith('.github/workflows/'):
                  continue
              path = Path(relative)
              if path.suffix.lower() not in {'.js','.html','.css','.json','.md','.txt','.yaml','.yml','.xml','.toml'}:
                  continue
              text = path.read_text('utf-8', errors='replace')
              checked += 1
              for label, regex in patterns:
                  if regex.search(text):
                      sys.exit(f'Kemungkinan {label} ditemukan pada {relative}. Hentikan commit dan periksa secara manual.')
          print(f'Pemeriksaan dasar secret lolos pada {checked} file teks; ini bukan audit keamanan menyeluruh.')
          PY

      - name: Uji kontrak paket Cloudflare
        run: python3 -m unittest discover -s tests -p test_cloudflare_package.py

      - name: Kemas ZIP Cloudflare dari file publik
        id: cloudflare_zip
        run: python3 scripts/package-cloudflare.py

      - name: Simpan ZIP Cloudflare sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cloudflare_zip.outputs.artifact_name }}
          path: ${{ steps.cloudflare_zip.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14

  build-minecraft-link:
    name: Bangun plugin SSCircle Link untuk Velocity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil sumber plugin
        uses: actions/checkout@v4
      - name: Pasang Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Kompilasi dan kemas plugin Velocity
        run: gradle -p minecraft-link-velocity clean build --no-daemon --stacktrace
      - name: Simpan JAR plugin
        uses: actions/upload-artifact@v4
        with:
          name: SSCircle-Minecraft-Link-Velocity
          path: minecraft-link-velocity/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  build-paper-link:
    name: Bangun SSCircle Player Sync untuk Paper 26.3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil sumber plugin Paper
        uses: actions/checkout@v4
      - name: Pasang Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Kompilasi SSCircle Player Sync Paper
        run: gradle -p minecraft-link-paper clean build --no-daemon --stacktrace
      - name: Simpan JAR Paper
        uses: actions/upload-artifact@v4
        with:
          name: SSCircle-Player-Sync-Paper
          path: minecraft-link-paper/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14


  build-skin-bridge:
    name: Bangun SSCircle Skin Bridge Paper 26.3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil source terbaru
        uses: actions/checkout@v4
      - name: Pasang Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Kompilasi addon terhadap Paper API asli
        run: gradle -p minecraft-skin-bridge-paper clean build --no-daemon --stacktrace
      - name: Simpan JAR addon
        uses: actions/upload-artifact@v4
        with:
          name: SSCircle-Skin-Bridge-Paper
          path: minecraft-skin-bridge-paper/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
