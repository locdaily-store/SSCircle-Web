name: SSCircle Voice Android APK

on:
  push:
    branches:
      - feature/sscircle-cross-voice
    paths:
      - 'cross-voice/mobile/android/**'
      - '.github/workflows/cross-voice-android.yml'
  pull_request:
    paths:
      - 'cross-voice/mobile/android/**'
      - '.github/workflows/cross-voice-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sscircle-voice-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile APK (Java 17 / Android 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses and install SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify Android project sources and logo
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/sscircle-logo.png
          test -s cross-voice/mobile/android/app/src/main/java/id/sscircle/voice/app/VoiceService.java
          test -s cross-voice/mobile/android/app/src/main/AndroidManifest.xml
      - name: Compile SSCircle Voice APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --project-dir cross-voice/mobile/android :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Verify real APK output
        shell: bash
        run: |
          set -euo pipefail
          APK=cross-voice/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -p "$APK" AndroidManifest.xml > /dev/null
          mkdir -p dist
          cp "$APK" dist/SSCircle-Voice-Android.apk
          sha256sum dist/SSCircle-Voice-Android.apk
      - name: Publish downloadable test APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSCircle-Voice-Android-APK
          path: dist/SSCircle-Voice-Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish Android prerelease for direct website download
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/sscircle-cross-voice'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=sscircle-voice-android-preview
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "SSCircle Voice Android Preview" --prerelease \
              --notes "APK uji SSCircle Voice. Belum diverifikasi pada perangkat nyata. Gunakan hanya untuk pengujian PR #74."
          fi
          gh release upload "$TAG" dist/SSCircle-Voice-Android.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SSCircle-Voice-Android.apk"
