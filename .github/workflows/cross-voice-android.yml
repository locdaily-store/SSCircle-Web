name: SSCircle Voice Android APK

on:
  push:
    branches:
      - feature/sscircle-cross-voice
    paths:
      - 'cross-voice/mobile/**'
      - '.github/workflows/cross-voice-android.yml'
      - '.github/workflows/cross-voice-ios.yml'
  pull_request:
    paths:
      - 'cross-voice/mobile/android/**'
      - '.github/workflows/cross-voice-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build native Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Pasang Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK debug yang bisa dipasang
        run: gradle -p cross-voice/mobile/android :app:assembleDebug --no-daemon --stacktrace
      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: SSCircle-Voice-Android-APK
          path: cross-voice/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
