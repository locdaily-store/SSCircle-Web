name: SSCircle Voice Android APK

on:
  push:
    branches:
      - feature/sscircle-cross-voice
    paths:
      - 'cross-voice/mobile/android/**'
      - '.github/workflows/cross-voice-android.yml'
  pull_request:
    paths:
      - 'cross-voice/mobile/android/**'
      - '.github/workflows/cross-voice-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sscircle-voice-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile APK (Java 17 / Android 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already includes a supported Android SDK.
      # android-actions/setup-android@v3 currently invokes obsolete "sdkmanager tools"
      # on runner image cmdline-tools 16.0 and exits 1 before compilation.
      - name: Verify preinstalled Android SDK and install SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager tidak ditemukan di runner"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$SDK_ROOT" > cross-voice/mobile/android/local.properties
          java -version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify Android project sources and logo
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/sscircle-logo.png
          test -s cross-voice/mobile/android/app/src/main/java/id/sscircle/voice/app/VoiceService.java
          test -s cross-voice/mobile/android/app/src/main/AndroidManifest.xml
      - name: Compile SSCircle Voice APK
        shell: bash
        env:
          # Optional repository variable for an alternate official SSCircle production website.
          VOICE_SITE_ORIGIN: ${{ vars.VOICE_SITE_ORIGIN }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$VOICE_SITE_ORIGIN" ]; then
            if [[ ! "$VOICE_SITE_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
              echo "::error::VOICE_SITE_ORIGIN harus domain HTTPS tanpa path"
              exit 1
            fi
            args+=("-PvoiceSiteOrigin=$VOICE_SITE_ORIGIN")
          fi
          gradle --project-dir cross-voice/mobile/android :app:assembleDebug "${args[@]}" --no-daemon --stacktrace --warning-mode all
      - name: Verify real APK output
        shell: bash
        run: |
          set -euo pipefail
          APK=cross-voice/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -p "$APK" AndroidManifest.xml > /dev/null
          mkdir -p dist
          cp "$APK" dist/SSCircle-Voice-Android.apk
          sha256sum dist/SSCircle-Voice-Android.apk
      - name: Publish downloadable test APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSCircle-Voice-Android-APK
          path: dist/SSCircle-Voice-Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish Android prerelease for direct website download
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/sscircle-cross-voice'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=sscircle-voice-android-preview
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "SSCircle Voice Android Preview" --prerelease \
              --notes "APK uji SSCircle Voice. Belum diverifikasi pada perangkat nyata. Gunakan hanya untuk pengujian PR #74."
          fi
          gh release upload "$TAG" dist/SSCircle-Voice-Android.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SSCircle-Voice-Android.apk"
